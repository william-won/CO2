<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이산화탄소 농도와 환기 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#d9d2c0; --wood:#a87444; --wood-dark:#6e4626;
  --board:#2c4a3d; --board-dark:#1f372d; --chalk:#f4f1e8;
  --yellow:#ffe14d; --orange:#ff9a3c; --red:#ff5252; --sky:#9fdcff;

}
*{box-sizing:border-box;margin:0}
body{
  min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding:clamp(8px,2.5vw,24px);
  background:radial-gradient(ellipse at 50% 0,#ece6d6,var(--wall) 70%);
  font-family:'Nanum Pen Script','Malgun Gothic','Apple SD Gothic Neo',cursive,sans-serif;
  color:var(--chalk);
}
.frame{
  width:min(100%,1000px); height:min(calc(100dvh - 24px),640px); min-height:380px;
  display:flex; flex-direction:column;
  padding:clamp(8px,2vw,18px) clamp(8px,2vw,18px) 0;
  background:linear-gradient(135deg,var(--wood),var(--wood-dark));
  border-radius:10px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 14px 30px rgba(0,0,0,.3);
}
.board{
  position:relative; flex:1; overflow:hidden; border-radius:3px;
  background:
    radial-gradient(ellipse at 25% 10%,rgba(255,255,255,.12),transparent 60%),
    linear-gradient(var(--board),var(--board-dark));
  box-shadow:inset 0 0 50px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.35);
}
.tray{
  position:relative; height:clamp(14px,3vw,22px); margin:0 -6px;
  background:linear-gradient(#c28a55,var(--wood-dark)); border-radius:0 0 6px 6px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.2);
}
.tray::before{ /* 칠판지우개 */
  content:""; position:absolute; right:12%; top:-10px; width:clamp(40px,8vw,64px); height:12px;
  background:linear-gradient(#3f3a36 0 38%,#d7b57a 38%); border-radius:2px;
}
.tray::after{ /* 분필 */
  content:""; position:absolute; left:12%; top:-6px; width:30px; height:7px; border-radius:3px;
  background:var(--chalk); box-shadow:40px 1px 0 -1px #ffd9e0,80px 0 0 -1px #bfe3ff;
}

#windCanvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}

.content{
  position:relative; z-index:1; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(6px,2vh,16px); padding:12px clamp(12px,4vw,40px); text-align:center;
}
.label,.value,.msg,button{
  -webkit-text-stroke:.02em currentColor;
  text-shadow:0 0 1px rgba(255,255,255,.5),0 0 14px rgba(255,255,255,.15);
}
.label{font-size:clamp(1.6rem,5vmin,2.5rem); opacity:.85}
.value{
  font-size:clamp(5.5rem,min(30vw,28vh),12rem); line-height:1;
  font-variant-numeric:tabular-nums; color:var(--chalk); transition:color .3s;
}
.value small{font-size:.3em; margin-left:.2em}
.msg{
  max-width:30em; min-height:calc(1.3em * 5);
  font-size:clamp(1.5rem,3vw + .8rem,2.5rem); line-height:1.3;
  word-break:keep-all; text-wrap:balance;
}
@media (min-width:700px){ .msg{min-height:calc(1.3em * 3)} }

button{
  font:inherit; font-size:clamp(1.9rem,5.5vmin,3rem); color:var(--chalk);
  min-width:6em; min-height:48px; padding:.1em 1.4em; cursor:pointer;
  background:rgba(255,255,255,.07); border:3px solid var(--chalk);
  border-radius:14px 20px 12px 18px / 18px 12px 20px 14px;
  transition:background .2s,border-color .2s,color .2s,transform .1s;
}
button:hover{background:rgba(255,255,255,.16)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px dashed var(--yellow); outline-offset:4px}
button.on{color:var(--sky); border-color:var(--sky); background:rgba(159,220,255,.12)}
</style>
</head>
<body>
<main class="frame">
  <div class="board">
    <canvas id="windCanvas" aria-hidden="true"></canvas>
    <div class="content">
      <div class="label">이산화탄소 농도</div>
      <div class="value" id="value">420<small>ppm</small></div>
      <p class="msg" id="msg" aria-live="polite"></p>
      <button id="btn" type="button" aria-pressed="false">환기</button>
    </div>
  </div>
  <div class="tray"></div>
</main>

<script>
const MIN = 420, MAX = 5000;     // 최솟값, 최댓값 (ppm)
const UP = 100, DOWN = 150;      // 기본 상태 증가량, 환기 상태 감소량 (ppm/초)

let co2 = MIN, ventilating = false, last = performance.now();
let shown = null;

const valueEl = document.getElementById('value');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('btn');

// 농도 구간별 색상과 멘트
function getLevel(v){
  if (v < 700)   return {color:'var(--chalk)',  msg:'공기 중 이산화 탄소 농도와 비슷하다.'};
  if (v <= 1000) return {color:'var(--yellow)', msg:'불쾌감이 느껴진다.'};
  if (v <= 2000) return {color:'var(--orange)', msg:'피로와 졸림 현상이 나타나는 등 컨디션 변화가 발생할 수 있다. 다중이용시설 실내공기 중 이산화탄소 유지기준(1,000 ppm)을 초과함.'};
  if (v <= 3000) return {color:'var(--red)',    msg:'두통 및 어깨 결림이 발생할 수 있다.'};
  return {color:'var(--red)', msg:'현기증 등이 발생할 수 있으며, 집중력과 인지 능력이 크게 저하된다.'};
}

function render(){
  const v = Math.round(co2);
  if (v === shown) return;
  shown = v;
  const lv = getLevel(v);
  valueEl.firstChild.nodeValue = v;
  valueEl.style.color = lv.color;
  if (msgEl.textContent !== lv.msg) msgEl.textContent = lv.msg;
}

/* ---------- 바람 효과 (캔버스) ----------
   물결치듯 흐르는 바람 줄기(일부는 소용돌이), 꼬리가 서서히 옅어짐,
   환기를 켜면 점점 세지고 끄면 남은 바람이 자연스럽게 지나가며 사라짐 */
const cv = document.getElementById('windCanvas');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const gusts = [], dust = [];
let power = 0, spawnT = 0, dustT = 0, needClear = false;

function spawnGust(){
  const v = W / rnd(2.6, 4), cd = rnd(.45, .6), curl = Math.random() < .4;
  gusts.push({
    age: 0, v, tail: rnd(.55, .95), w: rnd(1.6, 3.2),
    y0: rnd(.08, .92) * H, amp: rnd(5, 16), k: rnd(.006, .012), ph: rnd(0, 6.28),
    curl, cs: rnd(.7, 1.5), cd, r: v * cd / 6.283 * rnd(1.2, 1.5)
  });
}
function pos(g, t){
  const bx = -30 + g.v * t;
  let ox = 0, oy = 0;
  if (g.curl){
    const p = Math.min(Math.max((t - g.cs) / g.cd, 0), 1) * 6.283;
    ox = g.r * Math.sin(p); oy = -g.r * .7 * (1 - Math.cos(p));
  }
  return {x: bx + ox, y: g.y0 + g.amp * Math.sin(g.k * bx + g.ph) - t * 4 + oy};
}
const edge = x => Math.min(Math.max(x / (W * .12), 0), 1) * Math.min(Math.max((W - x) / (W * .15), 0), 1);

function windStep(dt){
  if (ventilating){
    power = Math.min(1, power + dt * .7);
    spawnT -= dt;
    if (spawnT <= 0){ spawnGust(); spawnT = rnd(.15, .35) / (.4 + .6 * power); }
    dustT -= dt;
    if (dustT <= 0 && power > .3 && dust.length < 60){
      dust.push({x: -5, y0: rnd(0, H), v: W / rnd(2.2, 4.5), a: rnd(6, 16), ph: rnd(0, 6.28), r: rnd(.8, 2)});
      dustT = .07;
    }
  } else power = Math.max(0, power - dt * .7);

  if (!gusts.length && !dust.length){
    if (needClear){ ctx.clearRect(0, 0, W, H); needClear = false; }
    return;
  }
  needClear = true;
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.strokeStyle = '#e8f6ff';

  for (let i = gusts.length - 1; i >= 0; i--){
    const g = gusts[i]; g.age += dt;
    if (-30 + g.v * (g.age - g.tail) > W + 80){ gusts.splice(i, 1); continue; }
    const n = 26, step = g.tail / n; let prev = null;
    for (let j = 0; j < n; j++){
      const t = g.age - j * step; if (t < 0) break;
      const p = pos(g, t);
      if (prev){
        const f = 1 - j / n;
        ctx.globalAlpha = .6 * f * f * edge(p.x);
        ctx.lineWidth = g.w * (.3 + .7 * f);
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
      prev = p;
    }
  }
  ctx.fillStyle = '#f4f1e8';
  for (let i = dust.length - 1; i >= 0; i--){
    const d = dust[i]; d.x += d.v * dt;
    if (d.x > W + 5){ dust.splice(i, 1); continue; }
    ctx.globalAlpha = .45 * edge(d.x);
    ctx.beginPath(); ctx.arc(d.x, d.y0 + d.a * Math.sin(d.x * .02 + d.ph), d.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function tick(now){
  const dt = Math.min((now - last) / 1000, 0.25); // 탭 전환 후 급변 방지
  last = now;
  co2 += (ventilating ? -DOWN : UP) * dt;
  co2 = Math.min(MAX, Math.max(MIN, co2));
  render();
  windStep(dt);
  requestAnimationFrame(tick);
}

btn.addEventListener('click', () => {
  ventilating = !ventilating;
  btn.textContent = ventilating ? '환기 중지' : '환기';
  btn.classList.toggle('on', ventilating);
  btn.setAttribute('aria-pressed', ventilating);
});

requestAnimationFrame(tick);
</script>
</body>
</html>
